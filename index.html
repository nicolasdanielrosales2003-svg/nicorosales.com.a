<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Las Meriendas De La Lili</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🌟 Las Meriendas De La Lili 🌟</h1>
  <p>Productos artesanales con amor y dedicación.</p>
</header>

<!-- Inicio de sesión -->
<section id="loginSection">
  <h2>Iniciar Sesión</h2>
  <input type="text" id="username" placeholder="Usuario">
  <input type="password" id="password" placeholder="Contraseña">
  <button class="btn" onclick="login()">Ingresar</button>
  <button class="btn" onclick="register()">Registrarse</button>
  <p id="loginMessage"></p>
</section>

<!-- Productos -->
<section id="productosSection" style="display:none;">
  <h2>Productos</h2>
  <div class="productos">
    <div class="producto">
      <img src="https://via.placeholder.com/250" alt="Torta Matera">
      <h3>Torta Matera</h3>
      <p class="precio" data-precio="7500">$7500</p>
      <button class="btn" onclick="abrirModal('Torta Matera', 7500, ['Marmolado','Limón','Vainilla','Naranja'])">Elegir sabor</button>
    </div>
    <div class="producto">
      <img src="https://via.placeholder.com/250" alt="Budín">
      <h3>Budín</h3>
      <p class="precio" data-precio="4000">$4000</p>
      <button class="btn" onclick="abrirModal('Budín', 4000, ['Marmolado','Limón','Vainilla','Naranja'])">Elegir sabor</button>
    </div>
  </div>
</section>

<!-- Carrito -->
<section id="carrito" style="display:none;">
  <h2>🛒 Carrito de Compras</h2>
  <div id="items"></div>
  <div class="total">Subtotal: $<span id="subtotal">0</span></div>
  <input type="text" id="cupon" placeholder="Ingresa tu cupón">
  <button class="btn" onclick="aplicarCupon()">Aplicar Cupón</button>
  <div class="total">Descuento: $<span id="descuento">0</span></div>
  <div class="total">Total: $<span id="total">0</span></div>
  <button class="btn pagar" onclick="pagar()">Pagar</button>
</section>

<!-- Modal sabores -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="cerrarModal()">&times;</span>
    <h3 id="modalProducto"></h3>
    <p>Elige un sabor:</p>
    <div id="sabores"></div>
    <button class="btn" onclick="agregarAlCarrito()">Agregar al carrito</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
